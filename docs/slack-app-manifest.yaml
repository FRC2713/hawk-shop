display_information:
  name: Hawk Shop
features:
  bot_user:
    display_name: Hawk Shop
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - channels:read
      - groups:read
      - users:read
      - users:read.email
      - files:write
settings:
  # Link buttons on release messages send Slack an interaction even though
  # they only open a URL. Replace the host with Hawk Shop's public origin.
  interactivity:
    is_enabled: true
    request_url: https://shop.example.org/api/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
