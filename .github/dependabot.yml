version: 2
updates:
  # Every npm update, majors included, arrives as one weekly PR.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # astro check refuses TypeScript 7. Remove this once it supports 7.
      - dependency-name: typescript
        versions: [">=7"]

  # Every GitHub Actions update arrives as one weekly PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # The Dockerfile's node base image. Node majors are left out: CI's
  # setup-node and package.json engines pin the same major, and Dependabot
  # would only bump the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
