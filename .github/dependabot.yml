version: 2
updates:
  # Minor and patch updates arrive as one weekly PR; each major gets its own.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # The Dockerfile's node base image. Node majors are left out: CI's
  # setup-node and package.json engines pin the same major, and Dependabot
  # would only bump the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
