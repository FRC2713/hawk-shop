name: CI

on:
  push:
    branches: [main]
  workflow_call:
  pull_request:

# A new push to a PR cancels that PR's older run. Non-PR runs, including the
# publish workflow's verify call, each get their own group, so they never cancel
# or queue behind each other.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Same pin as the Dockerfile, for the same reason: node:22 ships npm 10,
      # which resolves nitro's optional peer on lru-cache differently and calls
      # the committed lockfile out of sync. The lockfile is npm 11's.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:runtime
  container:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: hawk-candidate:pr
          build-args: APP_REVISION=${{ github.sha }}
          # Read-only: reuse the layers hawk_suite's publish-app.yml caches from
          # main. That relies on it keeping the default gha scope.
          cache-from: type=gha
      - name: Verify fresh startup and prior-release upgrade
        env:
          IMAGE: hawk-candidate:pr
        run: |
          bash scripts/smoke-image.sh
          bash scripts/smoke-upgrade.sh
