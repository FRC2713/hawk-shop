services:
  hawk-shop:
    build: .
    # Or pull a prebuilt image instead of building:
    # image: ghcr.io/frc2713/hawk-shop:latest
    container_name: hawk-shop
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      # Trust only an isolated gateway which clears and injects Suite headers.
      HAWK_SUITE_TRUST_PROXY: ${HAWK_SUITE_TRUST_PROXY:-false}
      HAWK_SUITE_TEAM_ID: ${HAWK_SUITE_TEAM_ID:-}
      HAWK_SUITE_ISSUER: ${HAWK_SUITE_ISSUER:-}
      # --- Onshape API key pair (optional) ----------------------------------
      ONSHAPE_ACCESS_KEY: ${ONSHAPE_ACCESS_KEY:-}
      ONSHAPE_SECRET_KEY: ${ONSHAPE_SECRET_KEY:-}
      ONSHAPE_BASE_URL: ${ONSHAPE_BASE_URL:-https://cad.onshape.com}

      # --- Deployment ------------------------------------------------------
      APP_URL: ${APP_URL:-http://localhost:3000}

      # --- Slack outbound integration (optional) --------------------------
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_WORKSPACE_ID: ${SLACK_WORKSPACE_ID:-}

      # --- Storage ---------------------------------------------------------
      # The SQLite file and uploaded images both live under here.
      DATA_DIR: /data
    volumes:
      - hawk-shop-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  hawk-shop-data:
